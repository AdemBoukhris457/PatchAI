[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchai"
version = "0.1.0"
description = "A channel-agnostic chatbot framework around a Deep Agents harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Adem Boukhris" }]
dependencies = [
    "deepagents>=0.5.2,<0.6",
    "langchain[mcp]>=1.4.0",
    "langchain-openai>=1.1.12",
]

[project.scripts]
patchai = "patchai.app:run"

[project.optional-dependencies]
dev = ["pytest>=8"]
pdf = ["typst>=0.15,<0.16", "matplotlib>=3.8"]
pptx = ["python-pptx>=1.0.2,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"patchai.plugins.pdf_report" = ["template.typ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py311"
